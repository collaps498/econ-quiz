<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Экономика · Тренажёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #EEF1F1;
  --card: #FFFFFF;
  --ink: #1B2430;
  --ink-soft: #55606f;
  --muted: #8A93A6;
  --hairline: #DBE1E4;
  --demand: #2B4570;
  --demand-soft: #E7ECF3;
  --supply: #C1523B;
  --supply-soft: #F7E9E5;
  --good: #3F7D58;
  --good-soft: #E4F1E8;
  --bad: #B3402C;
  --bad-soft: #FBE7E2;
  --warn: #A9781F;
  --warn-soft: #F6EDD9;
  --radius: 16px;
  --radius-sm: 10px;
  --tgvh: 100vh;
  color-scheme: light;
}
:root.dark{
  --bg: #10151C;
  --card: #171E27;
  --ink: #E7EAEE;
  --ink-soft: #AEB7C4;
  --muted: #6F7A8C;
  --hairline: #262F3B;
  --demand: #8FADDA;
  --demand-soft: #1C2740;
  --supply: #E3907A;
  --supply-soft: #2E211D;
  --good: #6FC08A;
  --good-soft: #16261B;
  --bad: #E2846F;
  --bad-soft: #2C1B18;
  --warn: #D8B863;
  --warn-soft: #2A2213;
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:var(--tgvh);
  background-image:
    linear-gradient(var(--hairline) 1px, transparent 1px),
    linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
  background-size: 24px 24px;
  background-attachment: local;
  transition: background-color .25s ease, color .25s ease;
}
.serif{ font-family:'Newsreader', Georgia, serif; }
.mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

#app{
  max-width:560px;
  margin:0 auto;
  min-height:var(--tgvh);
  display:flex;
  flex-direction:column;
  padding-bottom: env(safe-area-inset-bottom);
}

/* ---------- Header ---------- */
.topbar{
  display:flex; align-items:center; gap:10px;
  padding:14px 18px 10px;
  position:sticky; top:0; z-index:5;
  background: var(--bg);
}
.topbar .back{
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--card); border:1px solid var(--hairline);
  color:var(--ink); cursor:pointer; flex:0 0 auto;
}
.topbar .back svg{ width:16px; height:16px; }
.topbar .title{ font-family:'Newsreader',serif; font-size:19px; font-weight:600; letter-spacing:.01em; }
.topbar .sub{ font-size:12px; color:var(--muted); margin-top:1px;}

/* ---------- Home ---------- */
.hero{
  padding: 22px 20px 8px;
}
.hero .eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:10px;
}
.hero .eyebrow .dot{width:6px;height:6px;border-radius:50%; background:var(--supply);}
.hero h1{
  font-family:'Newsreader', serif; font-weight:600; font-size:32px; line-height:1.12; margin:0 0 8px;
  letter-spacing:-.01em;
}
.hero h1 em{ font-style: italic; color:var(--demand); font-weight:500;}
.hero p{ color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin:0 0 18px; max-width:46ch;}

.eqmark{ width:100%; max-width:220px; height:64px; margin: 4px 0 6px; }

.section-label{
  padding: 4px 20px 8px; margin-top:6px;
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  display:flex; align-items:center; justify-content:space-between;
}

.topic-list{ padding: 0 16px 16px; display:flex; flex-direction:column; gap:10px; }
.topic-card{
  background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius);
  padding:16px 16px 14px; cursor:pointer; position:relative; overflow:hidden;
}
.topic-card:active{ transform: scale(0.99); }
.topic-card .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.topic-card h3{ font-family:'Newsreader',serif; font-size:19px; font-weight:600; margin:0 0 4px; }
.topic-card .meta{ font-size:12.5px; color:var(--muted); }
.ring{ width:40px; height:40px; flex:0 0 auto; }
.ring circle{ fill:none; stroke-width:3.5; }
.ring .bg{ stroke: var(--hairline); }
.ring .fg{ stroke: var(--demand); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; transition: stroke-dasharray .4s ease;}
.ring text{ font-family:'IBM Plex Mono',monospace; font-size:10px; fill:var(--ink); }

.progress-track{ height:5px; border-radius:3px; background:var(--hairline); margin-top:12px; overflow:hidden; }
.progress-fill{ height:100%; background: linear-gradient(90deg, var(--demand), var(--supply)); border-radius:3px; transition: width .4s ease; }

.footer-note{
  padding: 18px 20px 30px; font-size:11.5px; color:var(--muted); line-height:1.6; text-align:center;
}

/* ---------- Topic screen (group list) ---------- */
.group-list{ padding: 6px 16px 24px; display:flex; flex-direction:column; gap:10px; }
.group-card{
  background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius);
  padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;
}
.group-card:active{ transform: scale(0.99); }
.group-icon{
  width:38px; height:38px; border-radius:10px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  background:var(--demand-soft); color:var(--demand);
}
.group-icon svg{ width:18px; height:18px; }
.group-info{ flex:1; min-width:0; }
.group-info h4{ margin:0 0 3px; font-size:15px; font-weight:600; }
.group-info .meta{ font-size:12px; color:var(--muted); }
.group-status{ font-size:11px; font-family:'IBM Plex Mono',monospace; flex:0 0 auto; text-align:right; color:var(--muted); }
.group-status.done{ color:var(--good); }
.chev{ width:16px; height:16px; color:var(--muted); flex:0 0 auto;}

/* ---------- Quiz ---------- */
.quiz-progress{ padding: 4px 18px 14px; display:flex; gap:3px; }
.quiz-progress .tick{ flex:1; height:4px; border-radius:2px; background:var(--hairline); }
.quiz-progress .tick.done-correct{ background: var(--good); }
.quiz-progress .tick.done-incorrect{ background: var(--bad); }
.quiz-progress .tick.current{ background: var(--demand); }

.quiz-wrap{ flex:1; padding: 0 18px 16px; display:flex; flex-direction:column; }
.qmeta{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.qmeta .qtype{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.qmeta .qsource{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); }

.qcard{
  background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius);
  padding:18px 18px 16px; margin-bottom:14px;
}
.qtext{ font-size:16.5px; line-height:1.5; font-weight:500; }

.options{ display:flex; flex-direction:column; gap:9px; }
.opt{
  display:flex; align-items:flex-start; gap:10px;
  background:var(--card); border:1.5px solid var(--hairline); border-radius:var(--radius-sm);
  padding:12px 13px; font-size:14.5px; line-height:1.4; cursor:pointer; text-align:left;
  color:var(--ink); transition: border-color .15s ease, background .15s ease;
}
.opt:active{ transform: scale(0.995); }
.opt .badge{
  flex:0 0 auto; width:22px; height:22px; border-radius:50%;
  border:1.5px solid var(--hairline); display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--muted);
  margin-top:0px;
}
.opt.checkbox .badge{ border-radius:6px; }
.opt .otext{ flex:1; padding-top:1px; }

.opt.selected{ border-color:var(--demand); background:var(--demand-soft); }
.opt.selected .badge{ border-color:var(--demand); color:var(--demand); background:var(--card);}

.opt.correct{ border-color:var(--good); background:var(--good-soft); }
.opt.correct .badge{ border-color:var(--good); background:var(--good); color:#fff; }
.opt.incorrect{ border-color:var(--bad); background:var(--bad-soft); }
.opt.incorrect .badge{ border-color:var(--bad); background:var(--bad); color:#fff; }
.opt.missed{ border-color:var(--warn); background:var(--warn-soft); }
.opt.missed .badge{ border-color:var(--warn); color:var(--warn); background:var(--card);}
.opt.disabled{ cursor:default; }
.opt.dim{ opacity:.55; }

.free-input-wrap{ margin-top:2px; }
.free-input{
  width:100%; border:1.5px solid var(--hairline); border-radius:var(--radius-sm);
  padding:13px 14px; font-size:16px; font-family:'IBM Plex Mono',monospace;
  background:var(--card); color:var(--ink);
}
.free-input:focus{ outline:none; border-color:var(--demand); }
.free-input.correct{ border-color:var(--good); background:var(--good-soft); }
.free-input.incorrect{ border-color:var(--bad); background:var(--bad-soft); }
.free-hint{ font-size:12px; color:var(--muted); margin-top:7px; }

.explain{
  margin-top:14px; padding-top:14px; border-top:1px dashed var(--hairline);
  display:none;
}
.explain.show{ display:block; animation: rise .3s ease; }
@keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.explain .verdict{
  display:flex; align-items:center; gap:8px; margin-bottom:9px; font-weight:600; font-size:14px;
}
.explain .verdict.correct{ color:var(--good); }
.explain .verdict.incorrect{ color:var(--bad); }
.explain .verdict svg{ width:18px; height:18px; flex:0 0 auto; }
.explain .body{ font-size:14px; line-height:1.6; color:var(--ink-soft); }
.explain .answer-line{ font-size:12.5px; color:var(--muted); margin-top:8px; font-family:'IBM Plex Mono',monospace;}

.eq-anim{ display:none; justify-content:center; padding: 2px 0 12px; }
.eq-anim.show{ display:flex; }
.eq-anim svg{ width:64px; height:44px; }
.eq-anim .dline, .eq-anim .sline{ fill:none; stroke-width:2.4; stroke-linecap:round; }
.eq-anim .dline{ stroke: var(--demand); stroke-dasharray: 60; stroke-dashoffset:60; animation: draw .5s ease forwards; }
.eq-anim .sline{ stroke: var(--supply); stroke-dasharray: 60; stroke-dashoffset:60; animation: draw .5s .1s ease forwards; }
.eq-anim .pt{ opacity:0; animation: pop .3s .55s ease forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
@keyframes pop{ from{opacity:0; transform:scale(0);} to{opacity:1; transform:scale(1);} }

.quiz-footer{ margin-top:auto; padding-top:6px; }
.btn{
  width:100%; padding:15px; border-radius:var(--radius-sm); border:none;
  font-family:'Inter',sans-serif; font-size:15px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-primary{ background:var(--ink); color:var(--bg); }
.btn-primary:disabled{ opacity:.35; }
.btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--hairline); }

/* ---------- Summary ---------- */
.summary-wrap{ padding: 8px 20px 24px; flex:1; display:flex; flex-direction:column;}
.summary-hero{ text-align:center; padding: 18px 0 10px; }
.summary-score{ font-family:'Newsreader',serif; font-size:56px; font-weight:600; line-height:1; }
.summary-score .of{ font-size:22px; color:var(--muted); font-weight:500; }
.summary-label{ color:var(--muted); font-size:13px; margin-top:6px;}
.summary-list{ margin-top:18px; display:flex; flex-direction:column; gap:8px; }
.summary-item{
  display:flex; align-items:center; gap:10px; padding:11px 13px;
  background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius-sm);
  font-size:13.5px; cursor:pointer;
}
.summary-item .ic{ width:20px; height:20px; flex:0 0 auto; }
.summary-item .ic.correct{ color:var(--good); }
.summary-item .ic.incorrect{ color:var(--bad); }
.summary-item .txt{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft); }
.summary-actions{ margin-top:20px; display:flex; flex-direction:column; gap:10px; }

.empty-dash{ font-size:12px; color:var(--muted); text-align:center; padding: 6px 0 2px;}

::selection{ background: var(--demand-soft); }
</style>
</head>
<body>
<div id="app"></div>

<script src="data.js"></script>
<script>
(function(){
"use strict";

/* ============ Telegram bootstrap ============ */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); try{ tg.disableVerticalSwipes(); }catch(e){} }

function applyTheme(){
  const root = document.documentElement;
  let isDark = false;
  if (tg && tg.colorScheme) isDark = tg.colorScheme === 'dark';
  else isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.classList.toggle('dark', isDark);
  if (tg && tg.themeParams && tg.themeParams.bg_color){
    // keep our own considered palette; just sync the outer chrome color
  }
  if (tg) tg.setHeaderColor && tg.setHeaderColor(isDark ? '#10151C' : '#EEF1F1');
  if (tg) tg.setBackgroundColor && tg.setBackgroundColor(isDark ? '#10151C' : '#EEF1F1');
}
applyTheme();
if (tg) tg.onEvent && tg.onEvent('themeChanged', applyTheme);
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

function setVh(){
  document.documentElement.style.setProperty('--tgvh', (tg && tg.viewportStableHeight ? tg.viewportStableHeight : window.innerHeight) + 'px');
}
setVh();
if (tg) tg.onEvent && tg.onEvent('viewportChanged', setVh);
window.addEventListener('resize', setVh);

function haptic(type){
  if (!tg || !tg.HapticFeedback) return;
  if (type==='success') tg.HapticFeedback.notificationOccurred('success');
  else if (type==='error') tg.HapticFeedback.notificationOccurred('error');
  else tg.HapticFeedback.impactOccurred('light');
}

/* ============ Storage (Telegram CloudStorage w/ localStorage fallback) ============ */
const Store = {
  get(key){
    return new Promise((resolve)=>{
      if (tg && tg.CloudStorage){
        tg.CloudStorage.getItem(key, (err, value)=>{
          if (err || !value) resolve(null); else resolve(value);
        });
      } else {
        resolve(localStorage.getItem(key));
      }
    });
  },
  set(key, value){
    return new Promise((resolve)=>{
      if (tg && tg.CloudStorage){
        tg.CloudStorage.setItem(key, value, ()=>resolve());
      } else {
        localStorage.setItem(key, value);
        resolve();
      }
    });
  }
};

/* ============ Data & progress model ============ */
const DATA = window.QUIZ_DATA;

// progress[topicId] = { "qid": "c" | "i" | "c:a,b" ... } compact encoding:
// "u" absent = unanswered. value = statusChar + ":" + selectedJoined
let PROGRESS = {};
let progressLoaded = false;

function encodeEntry(status, selected){
  const s = status==='correct' ? 'c' : 'i';
  const sel = Array.isArray(selected) ? selected.join(',') : String(selected==null?'':selected);
  return s + ':' + sel;
}
function decodeEntry(raw){
  if (!raw) return null;
  const idx = raw.indexOf(':');
  const status = raw[0]==='c' ? 'correct' : 'incorrect';
  const selRaw = idx>=0 ? raw.slice(idx+1) : '';
  return { status, selRaw };
}

async function loadProgress(topicId){
  const raw = await Store.get('progress_'+topicId);
  let obj = {};
  if (raw){
    try{ obj = JSON.parse(raw); }catch(e){ obj = {}; }
  }
  PROGRESS[topicId] = obj;
}
let saveTimer = null;
function persistProgress(topicId){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    Store.set('progress_'+topicId, JSON.stringify(PROGRESS[topicId]||{}));
  }, 150);
}

function allQuestionsOfGroup(topicId, groupIdx){
  return DATA.topics.find(t=>t.id===topicId).groups[groupIdx].questions;
}
function groupStats(topicId, groupIdx){
  const qs = allQuestionsOfGroup(topicId, groupIdx);
  const prog = PROGRESS[topicId]||{};
  let answered=0, correct=0;
  qs.forEach(q=>{ const e = prog[q.id]; if (e){ answered++; if (e[0]==='c') correct++; } });
  return { total: qs.length, answered, correct };
}
function topicStats(topicId){
  const topic = DATA.topics.find(t=>t.id===topicId);
  let total=0, answered=0, correct=0;
  topic.groups.forEach((g,i)=>{ const s = groupStats(topicId,i); total+=s.total; answered+=s.answered; correct+=s.correct; });
  return { total, answered, correct };
}

/* ============ Answer checking ============ */
function normalizeFree(str){
  return String(str).trim().toLowerCase().replace(/\s+/g,'').replace(',', '.').replace(/^\+/,'');
}
function checkFree(q, input){
  const a = normalizeFree(input);
  const b = normalizeFree(q.correct);
  if (a==='') return false;
  if (a===b) return true;
  const na = parseFloat(a), nb = parseFloat(b);
  if (!isNaN(na) && !isNaN(nb)) return Math.abs(na-nb) < 1e-6;
  return false;
}
function arraysEqualAsSets(a,b){
  if (a.length!==b.length) return false;
  const sa = [...a].sort(), sb=[...b].sort();
  return sa.every((v,i)=>v===sb[i]);
}

/* ============ Router / state ============ */
const app = document.getElementById('app');
let state = { screen:'home', topicId:null, groupIdx:null, qIndex:0 };
let sessionSelection = null; // in-progress selection for current question before submit (multi/free)
let sessionRevealed = false;

function nav(next){
  state = Object.assign({}, state, next);
  render();
  if (tg && tg.BackButton){
    if (state.screen==='home') tg.BackButton.hide();
    else { tg.BackButton.show(); }
  }
}
if (tg && tg.BackButton){
  tg.BackButton.onClick(()=>{
    if (state.screen==='quiz') nav({screen:'topic'});
    else if (state.screen==='summary') nav({screen:'topic'});
    else if (state.screen==='topic') nav({screen:'home'});
  });
}

/* ============ Icons ============ */
const ICONS = {
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
  cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
  tf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  single: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg>',
  multi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17 15l1.6 1.6L21 14"/></svg>',
  free: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
};

/* ============ Rendering ============ */
function render(){
  if (state.screen==='home') return renderHome();
  if (state.screen==='topic') return renderTopic();
  if (state.screen==='quiz') return renderQuiz();
  if (state.screen==='summary') return renderSummary();
}

function eqMarkSVG(){
  return `<svg class="eqmark" viewBox="0 0 220 64" fill="none">
    <line x1="12" y1="10" x2="80" y2="54" stroke="var(--demand)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="12" y1="54" x2="80" y2="10" stroke="var(--supply)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="46" cy="32" r="3.6" fill="var(--ink)"/>
    <text x="94" y="26" font-family="IBM Plex Mono" font-size="11" fill="var(--demand)">D</text>
    <text x="94" y="42" font-family="IBM Plex Mono" font-size="11" fill="var(--supply)">S</text>
    <text x="112" y="36" font-family="IBM Plex Mono" font-size="11" fill="var(--muted)">P* → тренажёр</text>
  </svg>`;
}

function renderHome(){
  const micro = DATA.topics.filter(t=>t.section==='micro');
  const macro = DATA.topics.filter(t=>t.section==='macro');

  function ringSVG(pct){
    const r=16, c=2*Math.PI*r;
    const off = c - (pct/100)*c;
    return `<svg class="ring" viewBox="0 0 40 40">
      <circle class="bg" cx="20" cy="20" r="${r}"/>
      <circle class="fg" cx="20" cy="20" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
      <text x="20" y="24" text-anchor="middle">${pct}%</text>
    </svg>`;
  }

  function topicCard(t){
    const s = topicStats(t.id);
    const pct = s.total ? Math.round(s.correct/s.total*100) : 0;
    const answeredPct = s.total ? Math.round(s.answered/s.total*100) : 0;
    return `<div class="topic-card" data-topic="${t.id}">
      <div class="row1">
        <div>
          <h3>${t.name}</h3>
          <div class="meta">${s.total} ${pluralQ(s.total)} · верно ${s.correct} из ${s.answered||0} отвеченных</div>
        </div>
        ${ringSVG(pct)}
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${answeredPct}%"></div></div>
    </div>`;
  }

  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow"><span class="dot"></span>Олмат · Сборник тестов 2025</div>
      <h1>Экономика:<br><em>спрос, предложение</em><br>и олимпиадная логика.</h1>
      <p>Разбор вопросов регионального и заключительного этапов ВсОШ, Сибириады, МОШ и «Высшей пробы» — с объяснением решения после каждого ответа.</p>
      ${eqMarkSVG()}
    </div>
    ${micro.length ? `<div class="section-label">Микроэкономика</div><div class="topic-list">${micro.map(topicCard).join('')}</div>` : ''}
    ${macro.length ? `<div class="section-label">Макроэкономика</div><div class="topic-list">${macro.map(topicCard).join('')}</div>` : `<div class="section-label">Макроэкономика</div><div class="empty-dash">Темы появятся по мере разбора сборника</div>`}
    <div class="footer-note">Вопросы — из открытого сборника «Олмат». Объяснения решений подготовлены отдельно для этого тренажёра.</div>
  `;
  app.querySelectorAll('.topic-card').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const topicId = el.dataset.topic;
      if (!PROGRESS[topicId]) await loadProgress(topicId);
      nav({screen:'topic', topicId});
    });
  });
}

function groupIcon(type){
  if (type==='tf') return ICONS.tf;
  if (type==='single') return ICONS.single;
  if (type==='multi') return ICONS.multi;
  return ICONS.free;
}

function pluralQ(n){
  const n100 = n % 100;
  if (n100 >= 11 && n100 <= 14) return 'вопросов';
  const n10 = n % 10;
  if (n10===1) return 'вопрос';
  if (n10>=2 && n10<=4) return 'вопроса';
  return 'вопросов';
}
function renderTopic(){
  const topic = DATA.topics.find(t=>t.id===state.topicId);
  const groupsHtml = topic.groups.map((g,i)=>{
    const s = groupStats(topic.id, i);
    const done = s.answered===s.total;
    let statusText = `${s.answered}/${s.total}`;
    if (done) statusText = `✓ ${s.correct}/${s.total}`;
    return `<div class="group-card" data-idx="${i}">
      <div class="group-icon">${groupIcon(g.questions[0].type)}</div>
      <div class="group-info">
        <h4>${g.name}</h4>
        <div class="meta">${s.total} ${pluralQ(s.total)}</div>
      </div>
      <div class="group-status ${done?'done':''}">${statusText}</div>
      <div class="chev">${ICONS.chev}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="topbar">
      <div class="back" id="btnBack">${ICONS.back}</div>
      <div>
        <div class="title">${topic.name}</div>
        <div class="sub">${topic.section==='micro'?'Микроэкономика':'Макроэкономика'}</div>
      </div>
    </div>
    <div class="group-list">${groupsHtml}</div>
    <div class="footer-note" id="resetProgress" style="cursor:pointer; text-decoration:underline;">Сбросить прогресс по теме</div>
  `;
  app.querySelector('#btnBack').addEventListener('click', ()=>nav({screen:'home'}));
  app.querySelectorAll('.group-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx,10);
      startQuiz(topic.id, idx);
    });
  });
  app.querySelector('#resetProgress').addEventListener('click', async ()=>{
    PROGRESS[topic.id] = {};
    await Store.set('progress_'+topic.id, JSON.stringify({}));
    renderTopic();
  });
}

function firstUnansweredIndex(topicId, groupIdx){
  const qs = allQuestionsOfGroup(topicId, groupIdx);
  const prog = PROGRESS[topicId]||{};
  for (let i=0;i<qs.length;i++){ if (!prog[qs[i].id]) return i; }
  return 0; // all answered -> review from start
}

function startQuiz(topicId, groupIdx){
  const qIndex = firstUnansweredIndex(topicId, groupIdx);
  sessionSelection = null; sessionRevealed = false;
  nav({screen:'quiz', topicId, groupIdx, qIndex});
}

function renderQuiz(){
  const topic = DATA.topics.find(t=>t.id===state.topicId);
  const group = topic.groups[state.groupIdx];
  const qs = group.questions;
  const q = qs[state.qIndex];
  const prog = PROGRESS[topic.id]||{};
  const existing = prog[q.id] ? decodeEntry(prog[q.id]) : null;

  const isAnswered = !!existing;
  sessionRevealed = isAnswered;

  // progress ticks
  const ticks = qs.map((qq,i)=>{
    const e = prog[qq.id] ? decodeEntry(prog[qq.id]) : null;
    let cls = '';
    if (i===state.qIndex) cls='current';
    else if (e) cls = e.status==='correct' ? 'done-correct' : 'done-incorrect';
    return `<div class="tick ${cls}"></div>`;
  }).join('');

  const typeLabel = {tf:'Верно / неверно', single:'Один ответ', multi:'Несколько верных', free:'Открытый ответ'}[q.type];
  const srcMatch = q.text.match(/^\(([^)]+)\)\s*/);

  let bodyHtml = '';
  if (q.type==='tf' || q.type==='single'){
    bodyHtml = `<div class="options">${q.options.map(o=>{
      let cls='opt';
      if (isAnswered){
        cls+=' disabled';
        if (existing.selRaw===o.key && q.correct.includes(o.key)) cls+=' correct';
        else if (existing.selRaw===o.key) cls+=' incorrect';
        else if (q.correct.includes(o.key)) cls+=' correct';
        else cls+=' dim';
      }
      return `<div class="${cls}" data-key="${o.key}"><div class="badge">${o.key.toUpperCase()}</div><div class="otext">${o.text}</div></div>`;
    }).join('')}</div>`;
  } else if (q.type==='multi'){
    bodyHtml = `<div class="options">${q.options.map(o=>{
      let cls='opt checkbox';
      const sel = isAnswered ? existing.selRaw.split(',') : (sessionSelection||[]);
      const isSel = sel.includes(o.key);
      if (isAnswered){
        cls+=' disabled';
        const isCorrect = q.correct.includes(o.key);
        if (isSel && isCorrect) cls+=' correct';
        else if (isSel && !isCorrect) cls+=' incorrect';
        else if (!isSel && isCorrect) cls+=' missed';
      } else if (isSel){ cls+=' selected'; }
      return `<div class="${cls}" data-key="${o.key}"><div class="badge">${isSel?'✓':''}</div><div class="otext">${o.text}</div></div>`;
    }).join('')}</div>
    <div class="quiz-footer" id="multiFooter">
      <button class="btn btn-primary" id="btnCheck" ${isAnswered?'disabled':''}>${isAnswered?'Проверено':'Проверить'}</button>
    </div>`;
  } else if (q.type==='free'){
    const curVal = isAnswered ? existing.selRaw : (sessionSelection||'');
    let inputCls = 'free-input';
    if (isAnswered) inputCls += existing.status==='correct' ? ' correct' : ' incorrect';
    bodyHtml = `<div class="free-input-wrap">
      <input class="${inputCls}" id="freeInput" inputmode="decimal" placeholder="Введите число" value="${curVal.replace(/"/g,'&quot;')}" ${isAnswered?'disabled':''}/>
      <div class="free-hint">Ответ — число. Дробную часть можно через точку или запятую.</div>
    </div>
    <div class="quiz-footer" id="freeFooter">
      <button class="btn btn-primary" id="btnCheck" ${isAnswered?'disabled':''}>${isAnswered?'Проверено':'Проверить'}</button>
    </div>`;
  }

  let explainHtml = '';
  if (isAnswered){
    const correct = existing.status==='correct';
    let answerLine = '';
    if (q.type==='free') answerLine = `Верный ответ: ${q.correct}`;
    else if (q.type==='multi') answerLine = 'Верно: ' + q.correct.map(k=>k.toUpperCase()).join(', ');
    else answerLine = 'Верно: ' + q.correct.map(k=>k.toUpperCase()).join(', ');
    explainHtml = `
      ${correct ? `<div class="eq-anim show"><svg viewBox="0 0 64 44"><path class="dline" d="M4 6 L52 38"/><path class="sline" d="M4 38 L52 6"/><circle class="pt" cx="28" cy="22" r="3.4" fill="var(--ink)"/></svg></div>` : ''}
      <div class="explain show">
        <div class="verdict ${correct?'correct':'incorrect'}">${correct?ICONS.check:ICONS.cross}${correct?'Верно':'Неверно'}</div>
        <div class="body">${q.explanation}</div>
        <div class="answer-line">${answerLine}</div>
      </div>`;
  }

  const isLast = state.qIndex === qs.length-1;
  const nextLabel = isAnswered ? (isLast ? 'Итоги' : 'Далее') : '';

  app.innerHTML = `
    <div class="topbar">
      <div class="back" id="btnBack">${ICONS.back}</div>
      <div>
        <div class="title" style="font-size:16px;">${group.name}</div>
        <div class="sub">${state.qIndex+1} из ${qs.length}</div>
      </div>
    </div>
    <div class="quiz-progress">${ticks}</div>
    <div class="quiz-wrap">
      <div class="qmeta">
        <div class="qtype">${typeLabel}</div>
        ${srcMatch ? `<div class="qsource">${srcMatch[1]}</div>` : ''}
      </div>
      <div class="qcard">
        <div class="qtext">${srcMatch ? q.text.replace(srcMatch[0],'') : q.text}</div>
      </div>
      <div class="qcard" style="padding-top:14px;">
        ${bodyHtml}
        ${explainHtml}
      </div>
      ${isAnswered ? `<div class="quiz-footer"><button class="btn btn-primary" id="btnNext">${nextLabel}</button></div>` : ''}
    </div>
  `;

  app.querySelector('#btnBack').addEventListener('click', ()=>nav({screen:'topic'}));

  if (!isAnswered){
    if (q.type==='tf' || q.type==='single'){
      app.querySelectorAll('.opt').forEach(el=>{
        el.addEventListener('click', ()=>{
          const key = el.dataset.key;
          const isCorrect = q.correct.includes(key);
          commitAnswer(topic.id, q, isCorrect?'correct':'incorrect', key);
        });
      });
    } else if (q.type==='multi'){
      app.querySelectorAll('.opt.checkbox').forEach(el=>{
        el.addEventListener('click', ()=>{
          const key = el.dataset.key;
          sessionSelection = sessionSelection || [];
          const idx = sessionSelection.indexOf(key);
          if (idx>=0) sessionSelection.splice(idx,1); else sessionSelection.push(key);
          renderQuiz();
        });
      });
      const btn = app.querySelector('#btnCheck');
      if (btn) btn.addEventListener('click', ()=>{
        const sel = sessionSelection||[];
        if (!sel.length) return;
        const isCorrect = arraysEqualAsSets(sel, q.correct);
        commitAnswer(topic.id, q, isCorrect?'correct':'incorrect', sel);
      });
    } else if (q.type==='free'){
      const input = app.querySelector('#freeInput');
      input.addEventListener('input', ()=>{ sessionSelection = input.value; });
      input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ doFreeCheck(); }});
      const btn = app.querySelector('#btnCheck');
      function doFreeCheck(){
        const val = input.value.trim();
        if (!val) return;
        const isCorrect = checkFree(q, val);
        commitAnswer(topic.id, q, isCorrect?'correct':'incorrect', val);
      }
      btn.addEventListener('click', doFreeCheck);
    }
  } else {
    const nextBtn = app.querySelector('#btnNext');
    if (nextBtn) nextBtn.addEventListener('click', ()=>{
      sessionSelection=null;
      if (isLast){ nav({screen:'summary', topicId:topic.id, groupIdx:state.groupIdx}); }
      else { nav({screen:'quiz', qIndex: state.qIndex+1}); }
    });
  }
}

function commitAnswer(topicId, q, status, selected){
  PROGRESS[topicId] = PROGRESS[topicId] || {};
  PROGRESS[topicId][q.id] = encodeEntry(status, selected);
  persistProgress(topicId);
  haptic(status==='correct' ? 'success' : 'error');
  sessionSelection = null;
  renderQuiz();
}

function renderSummary(){
  const topic = DATA.topics.find(t=>t.id===state.topicId);
  const group = topic.groups[state.groupIdx];
  const qs = group.questions;
  const prog = PROGRESS[topic.id]||{};
  let correct=0;
  const wrong = [];
  qs.forEach(q=>{
    const e = prog[q.id] ? decodeEntry(prog[q.id]) : null;
    if (e){ if (e.status==='correct') correct++; else wrong.push(q); }
  });
  const total = qs.length;

  app.innerHTML = `
    <div class="topbar">
      <div class="back" id="btnBack">${ICONS.back}</div>
      <div><div class="title" style="font-size:16px;">Итоги</div><div class="sub">${group.name}</div></div>
    </div>
    <div class="summary-wrap">
      <div class="summary-hero">
        <div class="summary-score">${correct}<span class="of">/${total}</span></div>
        <div class="summary-label">верных ответов${wrong.length?`, ошибок — ${wrong.length}`:' — идеально'}</div>
      </div>
      ${wrong.length ? `<div class="section-label" style="padding-left:2px;">Стоит повторить</div><div class="summary-list">${wrong.map(q=>`<div class="summary-item" data-qid="${q.id}"><span class="ic incorrect">${ICONS.cross}</span><span class="txt">${q.text.replace(/^\([^)]+\)\s*/,'')}</span></div>`).join('')}</div>` : ''}
      <div class="summary-actions">
        <button class="btn btn-primary" id="btnRestart">Пройти заново</button>
        <button class="btn btn-ghost" id="btnToTopic">К теме</button>
      </div>
    </div>
  `;
  app.querySelector('#btnBack').addEventListener('click', ()=>nav({screen:'topic'}));
  app.querySelector('#btnToTopic').addEventListener('click', ()=>nav({screen:'topic'}));
  app.querySelector('#btnRestart').addEventListener('click', async ()=>{
    qs.forEach(q=>{ delete PROGRESS[topic.id][q.id]; });
    await Store.set('progress_'+topic.id, JSON.stringify(PROGRESS[topic.id]));
    startQuiz(topic.id, state.groupIdx);
  });
  app.querySelectorAll('.summary-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qid = el.dataset.qid;
      const idx = qs.findIndex(q=>q.id===qid);
      nav({screen:'quiz', qIndex: idx});
    });
  });
}

/* ============ Boot ============ */
(async function boot(){
  app.innerHTML = `<div style="padding:40px 20px; text-align:center; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:13px;">Загрузка…</div>`;
  for (const t of DATA.topics){ await loadProgress(t.id); }
  nav({screen:'home'});
})();

})();
</script>
</body>
</html>
